[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoscast"
version = "0.1.0"
description = "UK electricity demand forecasting with a weather feature store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0.0",
  "pyarrow>=14.0.0",
  "duckdb>=1.0.0",
  "requests>=2.31.0",
  "matplotlib>=3.8.0",
  "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "pytest>=8.0.0",
]
